<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Web Tools Hub</title>
<link rel="icon" href="https://www.bishnulamsal.com.np/favicon.ico" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFE9;
    --surface:#FBFBF8;
    --ink:#1C2333;
    --ink-soft:#4B5265;
    --muted:#6E7566;
    --border:#D6D9D0;
    --amber:#E2A233;
    --amber-ink:#5C3D0A;
    --teal:#3A7D6C;
    --teal-soft:#E4EEEA;
    --amber-soft:#FBEBCE;
    --radius:6px;
  }
  html.dark{
    --paper:#14181C;
    --surface:#1B2025;
    --ink:#ECEAE1;
    --ink-soft:#C7C9C0;
    --muted:#8E9389;
    --border:#31373A;
    --amber:#E9AE4E;
    --amber-ink:#2A1C05;
    --teal:#5CAF9B;
    --teal-soft:#1E2C29;
    --amber-soft:#33280F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* header */
  header{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
  .logo svg{width:26px;height:26px;flex-shrink:0;}
  .logo span{font-weight:600;font-size:1.05rem;letter-spacing:-0.01em;}
  #themeToggle{
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:0.95rem;color:var(--ink);
  }
  #themeToggle:hover{border-color:var(--amber);}

  /* hero */
  .hero{padding:64px 0 40px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(var(--border) 1.1px, transparent 1.1px);
    background-size:22px 22px;
    opacity:.5;
    mask-image:linear-gradient(to bottom, black, transparent 85%);
    pointer-events:none;
  }
  .hero-inner{position:relative;max-width:640px;}
  .hero h1{
    font-size:clamp(2.1rem, 4vw, 2.9rem);
    line-height:1.12;
    font-weight:600;
    letter-spacing:-0.015em;
  }
  .hero p{
    margin:16px 0 30px;
    color:var(--ink-soft);
    font-size:1.05rem;
    line-height:1.55;
    max-width:52ch;
  }
  .search-shell{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:13px 16px;
    max-width:480px;
    transition:border-color .15s ease;
  }
  .search-shell:focus-within{border-color:var(--amber);}
  .search-shell svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
  #searchInput{
    border:none;outline:none;background:transparent;
    font-family:'Inter',sans-serif;font-size:0.98rem;color:var(--ink);
    width:100%;
  }
  #searchInput::placeholder{color:var(--muted);}
  .count-line{
    margin-top:14px;font-size:0.8rem;color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .count-line .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}

  /* filters */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:22px 0;
    border-bottom:1px solid var(--border);
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    padding:7px 13px;
    border-radius:20px;
    border:1.3px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .12s ease;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  /* grid */
  main{padding:36px 0 80px;}
  #toolsGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(268px, 1fr));
    gap:18px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    display:flex;flex-direction:column;
    text-decoration:none;color:inherit;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{border-color:var(--amber);transform:translateY(-3px);}
  .card:hover .grommet{background:var(--amber);border-color:var(--amber);}
  .card:hover .open-line::after{width:100%;}

  .grommet{
    position:absolute;top:-8px;left:20px;
    width:15px;height:15px;border-radius:50%;
    background:var(--paper);
    border:1.5px solid var(--border);
    transition:all .15s ease;
  }
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
  .icon-swatch{
    width:44px;height:44px;
    border:1.3px solid var(--border);
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
    background:var(--paper);
  }
  .tag-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    padding:4px 9px;
    border-radius:4px;
    white-space:nowrap;
    background:var(--teal-soft);
    color:var(--teal);
  }
  .tag-pill.alt{background:var(--amber-soft);color:var(--amber-ink);}
  .card h3{font-size:1.05rem;font-weight:600;margin-bottom:6px;letter-spacing:-0.01em;}
  .card p{
    font-size:0.87rem;line-height:1.5;color:var(--muted);
    margin:0 0 18px;
    flex-grow:1;
  }
  .open-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    font-weight:500;
    color:var(--ink);
    padding-top:14px;
    border-top:1px solid var(--border);
    position:relative;
  }
  .open-line::after{
    content:"";position:absolute;bottom:-1px;left:0;height:1.5px;width:0%;
    background:var(--amber);transition:width .18s ease;
  }

  .state-msg{
    grid-column:1/-1;text-align:center;padding:48px 20px;
    color:var(--muted);font-size:0.95rem;
  }
  .state-msg.error{color:#B4432E;}

  .skeleton{
    height:170px;border-radius:var(--radius);
    background:linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    border:1.5px solid var(--border);
  }
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  footer{border-top:1px solid var(--border);padding:26px 0;}
  footer .wrap{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    font-size:0.82rem;color:var(--muted);
  }
  footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--border);}
  footer a:hover{border-color:var(--amber);color:var(--amber-ink);}

  @media (max-width:520px){
    .hero{padding:44px 0 30px;}
    .header-row{padding:14px 0;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <a href="./" class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="var(--ink)" stroke-width="1.6"/>
        <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="var(--amber)" stroke-width="1.6"/>
        <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="var(--teal)" stroke-width="1.6"/>
        <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="var(--ink)" stroke-width="1.6"/>
      </svg>
      <span>Web Tools Hub</span>
    </a>
    <button id="themeToggle" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-inner">
    <h1>Small tools, ready to use</h1>
    <p>A shelf of static, single-page web apps. Open one and get straight to work — no installs, no accounts, nothing to configure.</p>
    <div class="search-shell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search tools" />
    </div>
    <div class="count-line"><span class="dot"></span><span id="countText" class="mono">Loading tools…</span></div>
  </div>
</section>

<div class="wrap">
  <div class="filters" id="filterRow"></div>
</div>

<main class="wrap">
  <div id="toolsGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Every tool here runs entirely in your browser.</span>
    <a href="https://github.com/bishnulamsal/app" target="_blank" rel="noopener">View source on GitHub</a>
  </div>
</footer>

<script>
  const GITHUB_USER = 'bishnulamsal';
  const REPO_NAME = 'app';

  let allTools = [];
  let activeTag = 'All';
  let query = '';

  async function loadToolsCatalog() {
    try {
      const res = await fetch('tools.json?cache=' + Date.now());
      if (res.ok) {
        allTools = await res.json();
        afterLoad();
        return;
      }
      const apiRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/tools`);
      if (apiRes.ok) {
        const files = await apiRes.json();
        allTools = files
          .filter(f => f.name.endsWith('.html'))
          .map(f => ({
            title: f.name.replace('.html', '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
            desc: 'A static, client-side web tool.',
            url: `tools/${f.name}`,
            icon: '🛠️',
            tag: 'Tool'
          }));
        afterLoad();
      } else {
        throw new Error('no source');
      }
    } catch (err) {
      document.getElementById('toolsGrid').innerHTML =
        `<div class="state-msg error">Couldn't load the tools list. Check the tools.json path and try again.</div>`;
      document.getElementById('countText').textContent = 'Failed to load';
    }
  }

  function afterLoad() {
    buildFilters();
    renderCards(allTools);
    updateCount(allTools.length);
  }

  function buildFilters() {
    const tags = ['All', ...new Set(allTools.map(t => t.tag || 'Utility'))];
    const row = document.getElementById('filterRow');
    row.innerHTML = tags.map(tag =>
      `<button class="chip ${tag === activeTag ? 'active' : ''}" data-tag="${tag}">${tag}</button>`
    ).join('');
    row.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTag = btn.dataset.tag;
        row.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
        applyFilters();
      });
    });
  }

  function applyFilters() {
    const filtered = allTools.filter(t => {
      const matchesTag = activeTag === 'All' || (t.tag || 'Utility') === activeTag;
      const matchesQuery = !query ||
        t.title.toLowerCase().includes(query) ||
        (t.desc && t.desc.toLowerCase().includes(query));
      return matchesTag && matchesQuery;
    });
    renderCards(filtered);
    updateCount(filtered.length, true);
  }

  function updateCount(n, isFiltered) {
    const el = document.getElementById('countText');
    if (n === 0) { el.textContent = 'No matches'; return; }
    el.textContent = `${n} tool${n === 1 ? '' : 's'}${isFiltered ? ' shown' : ' on the shelf'}`;
  }

  function renderCards(tools) {
    const grid = document.getElementById('toolsGrid');
    if (!tools || tools.length === 0) {
      grid.innerHTML = query
        ? `<div class="state-msg">No matches for “${query}”. Try a different search term.</div>`
        : `<div class="state-msg">No tools yet — add HTML files to the <span class="mono">tools/</span> folder to see them here.</div>`;
      return;
    }
    grid.innerHTML = tools.map((tool, i) => `
      <a href="${tool.url}" class="card">
        <span class="grommet"></span>
        <div class="card-top">
          <span class="icon-swatch">${tool.icon || '⚡'}</span>
          <span class="tag-pill ${i % 2 ? 'alt' : ''}">${tool.tag || 'Utility'}</span>
        </div>
        <h3>${tool.title}</h3>
        <p>${tool.desc || 'A fast, lightweight client-side web application.'}</p>
        <span class="open-line">Open tool</span>
      </a>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    query = e.target.value.toLowerCase().trim();
    applyFilters();
  });

  // Theme (in-memory only — no localStorage inside the preview sandbox)
  const themeBtn = document.getElementById('themeToggle');
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark');
    themeBtn.textContent = '☀️';
  }
  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    themeBtn.textContent = isDark ? '☀️' : '🌙';
  });

  loadToolsCatalog();
</script>
</body>
</html>
