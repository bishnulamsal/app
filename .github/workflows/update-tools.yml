name: Auto-update tools.json

on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'

permissions:
  contents: write

jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate tools.json with Meta Tag Scraping
        run: |
          python -c "
          import os, json, re

          tools_dir = 'tools'
          updated_tools = []

          if os.path.exists(tools_dir):
              for filename in sorted(os.listdir(tools_dir)):
                  if filename.endswith('.html'):
                      rel_path = f'{tools_dir}/{filename}'
                      
                      # Default fallback values
                      title = filename.replace('.html', '').replace('-', ' ').replace('_', ' ').title()
                      desc = 'Fast and lightweight client-side web application.'
                      icon = '⚡'
                      tag = 'Utility'

                      try:
                          with open(rel_path, 'r', encoding='utf-8') as hf:
                              content = hf.read()
                              
                              # Parse <title>
                              title_match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                              if title_match:
                                  title = title_match.group(1).strip()

                              # Parse <meta name=\"tool-description\" content=\"...\" />
                              desc_match = re.search(r'<meta\s+name=[\"\']tool-description[\"\']\s+content=[\"\'](.*?)[\"\']', content, re.IGNORECASE)
                              if desc_match:
                                  desc = desc_match.group(1).strip()

                              # Parse <meta name=\"tool-icon\" content=\"...\" />
                              icon_match = re.search(r'<meta\s+name=[\"\']tool-icon[\"\']\s+content=[\"\'](.*?)[\"\']', content, re.IGNORECASE)
                              if icon_match:
                                  icon = icon_match.group(1).strip()

                              # Parse <meta name=\"tool-tag\" content=\"...\" />
                              tag_match = re.search(r'<meta\s+name=[\"\']tool-tag[\"\']\s+content=[\"\'](.*?)[\"\']', content, re.IGNORECASE)
                              if tag_match:
                                  tag = tag_match.group(1).strip()
                      except Exception as e:
                          print(f'Error reading {filename}:', e)

                      updated_tools.append({
                          'title': title,
                          'desc': desc,
                          'url': rel_path,
                          'icon': icon,
                          'tag': tag
                      })

          with open('tools.json', 'w', encoding='utf-8') as f:
              json.dump(updated_tools, f, indent=2, ensure_ascii=False)
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tools.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update tools.json metadata [skip ci]" && git push)
