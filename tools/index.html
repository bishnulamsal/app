<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Redirecting...</title>
  
  <!-- Fallback instant redirect after 1 second -->
  <meta http-equiv="refresh" content="1;url=https://bishnulamsal.github.io/app/" />
  
  <link rel="icon" href="https://www.bishnulamsal.com.np/favicon.ico" type="image/x-icon" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">

  <div class="max-w-md w-full text-center bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/80 rounded-2xl p-8 shadow-xl">
    
    <!-- Animated Icon -->
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 text-3xl mb-4 animate-bounce">
      🔍
    </div>

    <h1 class="text-4xl font-extrabold text-gray-900 dark:text-white mb-2">404</h1>
    <h2 class="text-lg font-bold text-gray-700 dark:text-gray-200 mb-2">Page Not Found</h2>
    
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
      The page you are looking for doesn't exist. Redirecting you to the Web Tools Hub in <span id="timer" class="font-bold text-blue-600 dark:text-blue-400">1</span> second...
    </p>

    <!-- Progress Loader Bar -->
    <div class="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full overflow-hidden mb-6">
      <div class="bg-blue-600 h-full w-full animate-[pulse_1s_ease-in-out_infinite]"></div>
    </div>

    <!-- Manual Click Fallback -->
    <a 
      href="https://bishnulamsal.github.io/app/" 
      class="inline-flex items-center justify-center gap-2 w-full px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition"
    >
      Go to Homepage Now <span>→</span>
    </a>

  </div>

  <script>
    // JS Redirect Timer
    const TARGET_URL = "https://bishnulamsal.github.io/app/";
    let secondsLeft = 5;

    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
      secondsLeft--;
      if (timerElement) timerElement.textContent = secondsLeft;
      
      if (secondsLeft <= 0) {
        clearInterval(countdown);
        window.location.href = TARGET_URL;
      }
    }, 1000);

    // Dark Mode auto-sync
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</body>
</html>
