<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web Apps & Tools Hub</title>
  <link rel="icon" href="https://www.bishnulamsal.com.np/favicon.ico" type="image/x-icon" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <!-- Navigation Header -->
  <header class="border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <a href="./" class="flex items-center gap-2.5">
        <span class="text-2xl">🚀</span>
        <span class="text-xl font-bold bg-gradient-to-r from-blue-500 to-indigo-600 bg-clip-text text-transparent">
          Web Tools Hub
        </span>
      </a>
      
      <div class="flex items-center gap-3">
        <button id="themeToggle" aria-label="Toggle Theme" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Showcase Section -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Hero Header -->
    <div class="text-center max-w-2xl mx-auto mb-10">
      <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white sm:text-4xl mb-3">
        Useful Static Web Tools
      </h2>
      <p class="text-gray-600 dark:text-gray-400 text-sm sm:text-base">
        Fast, lightweight, client-side web applications hosted directly on GitHub Pages.
      </p>
    </div>

    <!-- Search Bar & Auto-Sync Status -->
    <div class="mb-8 flex flex-col sm:flex-row gap-4 justify-between items-center max-w-3xl mx-auto">
      <div class="w-full relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search web tools..." 
          class="w-full pl-4 pr-10 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm"
        />
        <span class="absolute right-3.5 top-3.5 text-gray-400">🔍</span>
      </div>
      <div class="flex items-center gap-2 text-xs font-semibold px-3.5 py-2 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 whitespace-nowrap">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        Auto-Synced Dashboard
      </div>
    </div>

    <!-- Dynamic Tools Grid Container -->
    <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading Skeletons -->
      <div class="animate-pulse bg-gray-200 dark:bg-gray-800 h-48 rounded-2xl"></div>
      <div class="animate-pulse bg-gray-200 dark:bg-gray-800 h-48 rounded-2xl"></div>
      <div class="animate-pulse bg-gray-200 dark:bg-gray-800 h-48 rounded-2xl"></div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 py-6 text-center text-sm text-gray-500">
    <div class="max-w-6xl mx-auto px-4">
      <p>© 2026 Web Tools Hub. All tools are static and client-side safe.</p>
    </div>
  </footer>

  <!-- App Logic & Dynamic Fetch -->
  <script>
    const GITHUB_USER = 'bishnulamsal'; 
    const REPO_NAME = 'app';

    let allTools = [];

    // 1. Fetch Tools Metadata (Fallback chain: tools.json -> GitHub API)
    async function loadToolsCatalog() {
      const grid = document.getElementById('toolsGrid');
      
      try {
        // Method A: Load generated tools.json (Fastest & Rich Metadata)
        const res = await fetch('tools.json?cache=' + Date.now());
        if (res.ok) {
          allTools = await res.json();
          renderCards(allTools);
          return;
        }

        // Method B: Direct API fallback if tools.json is missing
        const apiRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/tools`);
        if (apiRes.ok) {
          const files = await apiRes.json();
          allTools = files
            .filter(file => file.name.endsWith('.html'))
            .map(file => ({
              title: file.name.replace('.html', '').replace(/[-_]/g, ' ').toUpperCase(),
              desc: 'Static client-side web app tool.',
              url: `tools/${file.name}`,
              icon: '🛠️',
              tag: 'Tool'
            }));
          renderCards(allTools);
        }
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-red-500 font-medium">
            ⚠️ Failed to load tools catalog. Please verify your repository configuration.
          </div>
        `;
      }
    }

    // 2. Render UI HTML Cards
    function renderCards(tools) {
      const grid = document.getElementById('toolsGrid');
      
      if (!tools || tools.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            No web tools found. Add static .html files to the <b>tools/</b> folder.
          </div>
        `;
        return;
      }

      grid.innerHTML = tools.map(tool => `
        <div class="group bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/70 rounded-2xl p-5 hover:shadow-xl hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-4">
              <span class="text-3xl p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700/60 leading-none">${tool.icon || '⚡'}</span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-800/40">
                ${tool.tag || 'Utility'}
              </span>
            </div>
            <h3 class="font-bold text-lg mb-2 text-gray-900 dark:text-gray-100 group-hover:text-blue-500 transition-colors">
              ${tool.title}
            </h3>
            <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2 leading-relaxed">
              ${tool.desc || 'Fast and lightweight client-side web application.'}
            </p>
          </div>

          <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700/50 flex justify-between items-center">
            <a href="${tool.url}" class="w-full inline-flex items-center justify-center gap-2 text-sm font-semibold px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition">
              Open App <span>→</span>
            </a>
          </div>
        </div>
      `).join('');
    }

    // 3. Search Filter Functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = allTools.filter(t => 
        t.title.toLowerCase().includes(query) || 
        (t.desc && t.desc.toLowerCase().includes(query)) ||
        (t.tag && t.tag.toLowerCase().includes(query))
      );
      renderCards(filtered);
    });

    // 4. Dark Mode Handler
    const themeBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    // Check saved local preference or system preference
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      document.documentElement.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      themeIcon.textContent = isDark ? '☀️' : '🌙';
    });

    // Initialize App
    loadToolsCatalog();
  </script>
</body>
</html>
